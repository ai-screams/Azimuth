      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --sky: linear-gradient(180deg, #0C1A3A 0%, #24305E 50%, #5E4677 85%, #9A5E6E 100%);

        --ink-soft: rgba(255,255,255,0.8);

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: var(--sky);
      color: var(--ink);
      font-family: var(--font);
      text-align: center;
    }
    main { max-width: 32rem; display: flex; flex-direction: column; align-items: center; gap: 0.9rem; }
    h1 { font-size: clamp(2.6rem, 9vw, 4.5rem); font-weight: 800; letter-spacing: -0.045em; line-height: 1; }
    p { font-size: 1.05rem; line-height: 1.5; color: var(--ink-soft); }
    .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 0.8rem; }
    a.btn {
      padding: 11px 22px;
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
      background: var(--cta-bg);
      color: var(--cta-fg);
    }
    a.btn.secondary { background: transparent; color: var(--ink); border: 1px solid currentColor; }

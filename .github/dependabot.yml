# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# 이 프로젝트는 SPM/npm 의존성이 없고, 워크플로의 GitHub Actions만 관리 대상이다.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    # 라벨은 Dependabot 기본값(dependencies)에 맡긴다. labels: 로 지정한 커스텀 라벨은 리포에
    # 미리 없으면 조용히 무시되지만, 기본 라벨은 Dependabot이 필요할 때 직접 만든다.
    # https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference#labels
    # PR 노이즈를 줄이기 위해 minor/patch 업데이트를 한 PR로 묶는다.
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # 레거시판 브랜치(legacy/10.13)의 Actions 핀. Dependabot은 기본 브랜치의 이 파일만 읽으므로 여기서 지정한다.
  # target-branch를 쓴 항목은 버전 업데이트만 연다(보안 업데이트는 항상 기본 브랜치 대상). LEGACY.md 참고.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "legacy/10.13"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      legacy-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

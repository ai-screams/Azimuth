name: CodeQL

# Swift 코드 정적 분석(SAST). 결과는 GitHub Security → Code scanning 탭에 보고된다.
# 시크릿(gitleaks)과 별개로, 코드 자체의 취약 패턴(안전하지 않은 API 사용 등)을 잡는다.
# 액션은 commit SHA로 핀(Dependabot이 버전 주석 갱신). 권한은 최소.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 9 * * 1" # 매주 월요일 09:00 UTC 정기 스캔
  # PR 트리거 제외: Swift 분석이 ~15분이라 PR 피드백을 느리게 한다. PR은 ci.yml(lint/build/
  # test/coverage/secret)로 빠르게 검증하고, CodeQL은 main 머지 직후와 주간으로 잡는다.

permissions:
  contents: read
  security-events: write # Code scanning 결과 업로드
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false # main 분석은 취소하지 않는다(PR 트리거 없음)

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-15 # Swift 분석은 macOS 필요. ci/release와 러너 통일.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Xcode를 고정한다(최신 안정판 지정은 러너 이미지 갱신에 따라 조용히 바뀐다). macOS 27 전용 API를 쓰지 않는다는
      # 결정(#174)의 전제가 SDK 26이라, 실제로 그 버전인지 다음 스텝에서 확인한다.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.3"

      - name: Check Xcode version
        run: |
          set -euo pipefail
          # 출력 전체를 받아 첫 줄만 비교한다. `xcodebuild -version | head -1`은 head가 먼저 닫으면 SIGPIPE(141)로
          # pipefail에 걸려, 버전이 맞아도 실패할 수 있다.
          version="$(xcodebuild -version)"
          echo "$version"
          [ "${version%%$'\n'*}" = "Xcode 26.3" ] || { echo "::error::Expected Xcode 26.3"; exit 1; }

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: swift

      # Swift는 컴파일 언어 → CodeQL이 실제 빌드를 관찰해야 분석 가능(ci.yml과 동일 빌드).
      - name: Build for analysis
        run: |
          xcodebuild \
            -project ./Azimuth.xcodeproj \
            -scheme Azimuth \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: "/language:swift"

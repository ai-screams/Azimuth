name: CI

on:
  push:
    branches:
      - legacy/10.13
  pull_request:
    branches:
      - legacy/10.13

permissions:
  contents: read
  security-events: write

# PR에 연속 푸시 시 오래된 실행을 취소(러너 시간 절약). legacy/10.13 푸시는 취소하지 않는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 레거시판(10.13~12)은 Xcode 26.3으로 빌드한다(27은 12.0 미만 타깃 거부). 러너 기본값에 기대지 않고 정확히 고정·단언.
env:
  XCODE_VERSION: "26.3"
  XCODE_BUILD: 17C529

jobs:
  secret-scan:
    runs-on: macos-15 # release-legacy.yml과 러너 통일(재현성)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: brew install gitleaks

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          gitleaks git \
            --config ./.gitleaks.toml \
            --report-format sarif \
            --report-path gitleaks-report.sarif

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: gitleaks-report.sarif

      - name: Fail job when Gitleaks finds leaks
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "Gitleaks detected secrets."
          exit 1

  lint-and-build:
    runs-on: macos-15 # release-legacy.yml과 러너 통일(재현성)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Assert Sparkle pin (2.9.3 exact — 2.10+ needs macOS 12)
        run: ./scripts/legacy-sparkle-pin.sh

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Assert Xcode version
        run: |
          set -euo pipefail
          xcodebuild -version
          [[ "$(xcodebuild -version | tr '\n' ' ')" == "Xcode $XCODE_VERSION Build version $XCODE_BUILD " ]] \
            || { echo "::error::Expected Xcode $XCODE_VERSION ($XCODE_BUILD)"; exit 1; }

      - name: Install Swift tooling (pinned)
        # brew(항상 최신)는 룰 드리프트로 CI를 깨뜨릴 수 있어 릴리스 바이너리를 버전+SHA-256으로 고정.
        # 업그레이드는 의도적 변경으로: 버전과 체크섬을 함께 갱신하고 로컬 brew 버전과 맞춘다.
        env:
          SWIFTFORMAT_VERSION: 0.62.1
          SWIFTFORMAT_SHA256: 7cb1cb1fae04932047c7015441c543848e8e60e1572d808d080e0a1f1661114a
          SWIFTLINT_VERSION: 0.65.0
          SWIFTLINT_SHA256: d6cb0aa7a2f5f1ef306fc9e37bcb54dc9a26facc8f7784ac0c3dd3eccf5c6ba6
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          echo "${SWIFTFORMAT_SHA256}  ${RUNNER_TEMP}/swiftformat.zip" | shasum -a 256 -c -
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  ${RUNNER_TEMP}/swiftlint.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/swift-tools"
          unzip -oq "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swift-tools"
          unzip -oq "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swift-tools"
          echo "$RUNNER_TEMP/swift-tools" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swift-tools/swiftformat" --version
          "$RUNNER_TEMP/swift-tools/swiftlint" --version

      - name: SwiftFormat
        run: swiftformat ./Azimuth --config ./.swiftformat --lint

      - name: SwiftLint
        run: swiftlint lint --strict --no-cache --config ./.swiftlint.yml

      # #if DEBUG 차이가 있어 두 구성 모두 빌드한다. 산출물 경로를 고정해 Release 번들을 게이트에 넘긴다.
      - name: Xcode build (Debug + Release)
        run: |
          set -euo pipefail
          for configuration in Debug Release; do
            xcodebuild \
              -project ./Azimuth.xcodeproj \
              -scheme Azimuth \
              -configuration "$configuration" \
              -destination 'generic/platform=macOS' \
              -derivedDataPath "$RUNNER_TEMP/dd" \
              CODE_SIGNING_ALLOWED=NO \
              build
          done

      # 서명 없는 번들 게이트: 실제 Xcode 26.3 산출물에 10.13 런타임을 넣고(ad-hoc) 최소 OS·아키텍처·rpath·
      # 동봉 런타임·심볼을 단언한다. 서명·공증 쪽은 release-legacy.yml이 --signed로 본다.
      - name: Legacy bundle gate (unsigned)
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release/Azimuth.app"
          ./scripts/legacy-bundle-runtime.sh "$APP" -
          ./scripts/legacy-bundle-gate.sh "$APP"

      - name: Tests + coverage gate (pure logic >= 90%)
        run: make coverage # 테스트 실행 + 순수 로직 라인 ≥ 90% 게이트(중복 test 스텝 제거)
